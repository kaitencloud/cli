# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kaiten

before:
  hooks:
    - go mod tidy
    # Completions ship in every archive and Linux package, so they are
    # generated once here from the binary that is about to be released.
    - sh -c 'mkdir -p completions && for shell in bash zsh fish; do go run ./cmd/kaiten completion "$shell" > "completions/kaiten.$shell"; done'

builds:
  - id: kaiten
    main: ./cmd/kaiten
    binary: kaiten
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# install/install.sh and install/install.ps1 download these by name, so the
# template is part of the install contract: kaiten_<os>_<arch>.tar.gz|zip.
archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Apache-2.0 asks every redistribution to carry LICENSE and NOTICE. GoReleaser includes
    # LICENSE by default but not NOTICE; listing files replaces the defaults, so README is
    # listed too.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - completions/*

checksum:
  name_template: "checksums.txt"

# .deb, .rpm and .apk, attached to the release next to the archives. Named
# like the archives, without the version, so that
# releases/latest/download/kaiten_linux_amd64.deb is a stable URL; the version
# lives in the package metadata, where dpkg, rpm and apk read it.
nfpms:
  - id: packages
    package_name: kaiten
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    vendor: Kaiten
    homepage: https://kaiten.sh
    maintainer: Kaiten <support@kaiten.sh>
    description: Command-line interface for the Kaiten API.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    contents:
      - src: completions/kaiten.bash
        dst: /usr/share/bash-completion/completions/kaiten
      - src: completions/kaiten.zsh
        dst: /usr/share/zsh/site-functions/_kaiten
      - src: completions/kaiten.fish
        dst: /usr/share/fish/vendor_completions.d/kaiten.fish
      # The doc/license content types are rpm-only; deb and apk silently skip
      # them, so each packager gets the license file in its own convention.
      - src: LICENSE
        dst: /usr/share/licenses/kaiten/LICENSE
        type: license
        packager: rpm
      - src: NOTICE
        dst: /usr/share/licenses/kaiten/NOTICE
        type: license
        packager: rpm
      - src: LICENSE
        dst: /usr/share/doc/kaiten/copyright
        packager: deb
      - src: NOTICE
        dst: /usr/share/doc/kaiten/NOTICE
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/kaiten/LICENSE
        packager: apk
      - src: NOTICE
        dst: /usr/share/licenses/kaiten/NOTICE
        packager: apk

# scoop bucket add kaitencloud https://github.com/kaitencloud/scoop-bucket
# scoop install kaiten
#
# Publishing the manifest needs a token that can push to
# kaitencloud/scoop-bucket; the workflow passes it as SCOOP_BUCKET_GITHUB_TOKEN.
# When it is empty, or the tag is a pre-release, the manifest is still rendered
# into dist/ and simply not pushed, so a release never fails on a missing bucket
# and an rc never becomes what `scoop install` hands out.
scoops:
  - name: kaiten
    repository:
      owner: kaitencloud
      name: scoop-bucket
      token: "{{ envOrDefault \"SCOOP_BUCKET_GITHUB_TOKEN\" \"\" }}"
    directory: bucket
    homepage: https://kaiten.sh
    description: Command-line interface for the Kaiten API
    license: Apache-2.0
    skip_upload: "{{ if and (envOrDefault \"SCOOP_BUCKET_GITHUB_TOKEN\" \"\") (not .Prerelease) }}false{{ else }}true{{ end }}"

# ghcr.io/kaitencloud/cli:<version> and :latest, one multi-platform image. The
# workflow logs in to GHCR with the job's GITHUB_TOKEN. Built in the publish
# phase, so `--snapshot` produces per-platform local images and `--skip=docker`
# none at all.
dockers_v2:
  - id: kaiten
    ids:
      - kaiten
    images:
      - ghcr.io/kaitencloud/cli
    tags:
      - "{{ .Version }}"
      # A pre-release tag (v1.2.0-rc.1) does not move latest.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    extra_files:
      - LICENSE
      - NOTICE
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Command-line interface for the Kaiten API
      org.opencontainers.image.url: https://github.com/kaitencloud/cli
      org.opencontainers.image.source: https://github.com/kaitencloud/cli
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kaitencloud
    name: cli
  # A pre-release tag (v1.2.0-rc.1) is published as a GitHub pre-release, which
  # also keeps install.sh's "latest" pointing at the last stable one.
  prerelease: auto
  footer: |
    ## Install

    ```shell
    # macOS and Linux
    curl -fsSL https://raw.githubusercontent.com/kaitencloud/cli/main/install/install.sh | sh -s -- {{ .Version }}

    # Windows
    irm https://raw.githubusercontent.com/kaitencloud/cli/main/install/install.ps1 | iex
    scoop install kaiten

    # Container
    docker run --rm ghcr.io/kaitencloud/cli:{{ .Version }} version
    ```

    Every archive and package above is listed in `checksums.txt`. See the
    [README](https://github.com/kaitencloud/cli#installation) for the other options.
