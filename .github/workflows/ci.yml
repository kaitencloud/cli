name: CI

# The default-branch ruleset requires three checks, named `lint`, `build` and `test`, as in
# Kaiten's SDK repositories. Each job below reports one of them.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 1.25.x, not go-version-file: go.mod. setup-go reads the go directive as
      # an exact patch, which would pin every released binary to the stdlib as
      # it shipped in that patch, CVEs included. This tracks the newest patch of
      # the minor version go.mod declares, which is what a shipped binary needs;
      # go.mod stays the language-version contract.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m ./...

      - name: Verify module metadata
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      # govulncheck reports only vulnerabilities in code the build actually reaches, so a
      # finding here is a real exposure in a shipped binary rather than a dependency-tree
      # coincidence. Pinned to match the version `task vuln` runs locally.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # The release pipeline only runs on a tag push, so a broken .goreleaser.yaml
      # would otherwise surface at the worst moment. Same version as `task release:check`.
      - name: GoReleaser config
        run: go run github.com/goreleaser/goreleaser/v2@v2.12.7 check

      # Both installers are fetched raw from this branch by users, so a syntax
      # error ships the moment it merges.
      - name: Install scripts
        run: |
          shellcheck --shell=sh install/install.sh
          pwsh -NoProfile -Command '
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile("install/install.ps1", [ref]$tokens, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          '

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Build
        run: go build -v ./...

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race -shuffle=on -cover ./...
