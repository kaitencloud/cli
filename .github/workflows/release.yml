name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1.26.x, the oldest Go still patched: a released binary carries the
      # stdlib it was built with, and 1.25 left support when 1.27 shipped, so
      # its advisories are fixed in 1.26 and later only. setup-go reads the go
      # directive as an exact patch, which would pin every released binary to
      # the stdlib as it shipped in that patch, CVEs included, so this names a
      # minor version and takes its newest patch -- check-latest, or setup-go
      # settles for the newest one the runner caches. go.mod stays the
      # language-version contract.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.sum

      # The arm64 image is built on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to kaitencloud/scoop-bucket. GITHUB_TOKEN
          # cannot, as it is scoped to this repository. Left unset, the manifest
          # is rendered into dist/ but not published -- see .goreleaser.yaml.
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
